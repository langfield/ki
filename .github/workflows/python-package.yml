name: CI

on:
  push: { branches: ["dev"] }
  pull_request: { branches: ["dev"] }
  workflow_dispatch:

permissions: {}

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y tidy

      - name: Configure git
        run: |
          git config --global user.email "ki@example.com"
          git config --global user.name "Ki GithubActions"
          git --version

      - name: Install ki
        run: |
          pip install pytest wheel
          pip install .

      - name: Test package
        run: |
          pytest -vv tests/test_package.py
          ./tests/test_subdeck.sh

      - name: Install test dependencies
        run: |
          pip install -r dev-requirements.txt

      - name: Unit tests
        run: |
          pytest -vv --timeout=120 tests/test_ki.py tests/test_parser.py

      - name: Integration tests
        run: |
          pytest -vv --timeout=120 tests/test_integration.py
